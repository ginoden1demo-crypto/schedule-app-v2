<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宜野湾電設 案件管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* 配置：左にアイコンの縦メニュー（現行アプリと同じ）、右に作業エリア。色は現行の深緑ネイビー＋ティールを引き継ぐ */
:root{
  --bg:#EEF2F1;--surface:#FFFFFF;--surface2:#F6F9F8;--navy:#16323F;--navy2:#102530;--navy3:#2C5D6E;
  --teal:#2E8B84;--teal-ink:#0B2B27;--amber:#B8901A;--coral:#C4443A;--violet:#8464C4;--blue:#4C6EF5;
  --text:#1B2A2E;--mute:#5C6B6E;--faint:#8B979A;--border:#DCE3E1;--soft:#E7ECEA;
  --good:#1F7A4D;--good-bg:#E2F3EA;--warn:#8A6A00;--warn-bg:#FFF3CC;--bad:#B3261E;--bad-bg:#FBE4E1;--info-bg:#E4EEFB;--info:#2A5BB0;
  --sell:#EAF1FF;--cost:#FFF7E6;--paper:#FFFFFF;--paper-ink:#1A1A1A;--paper-line:#333333;
  --shadow:0 1px 2px rgba(22,50,63,.06),0 4px 12px rgba(22,50,63,.06);--lift:0 10px 28px rgba(0,0,0,.25);
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--mono:"Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1E;--surface:#17252B;--surface2:#1B2C33;--navy:#0B171C;--navy2:#081215;--navy3:#2C5D6E;
  --teal:#3BA39B;--teal-ink:#06201D;--amber:#E0B73F;--coral:#E26A60;--violet:#A58BE0;--blue:#7C93FF;
  --text:#E6EEEE;--mute:#A3B3B5;--faint:#7C8D90;--border:#2B3D44;--soft:#233238;
  --good:#6FD39B;--good-bg:#173626;--warn:#F0CB61;--warn-bg:#3A3112;--bad:#FF8F86;--bad-bg:#40201D;--info-bg:#17294A;--info:#8DB4FF;
  --sell:#16284A;--cost:#3A2E14;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1E;--surface:#17252B;--surface2:#1B2C33;--navy:#0B171C;--navy2:#081215;--navy3:#2C5D6E;
  --teal:#3BA39B;--teal-ink:#06201D;--amber:#E0B73F;--coral:#E26A60;--violet:#A58BE0;--blue:#7C93FF;
  --text:#E6EEEE;--mute:#A3B3B5;--faint:#7C8D90;--border:#2B3D44;--soft:#233238;
  --good:#6FD39B;--good-bg:#173626;--warn:#F0CB61;--warn-bg:#3A3112;--bad:#FF8F86;--bad-bg:#40201D;--info-bg:#17294A;--info:#8DB4FF;
  --sell:#16284A;--cost:#3A2E14;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--teal)}
input:disabled,select:disabled{background:var(--soft);color:var(--faint)}
.app{display:flex;height:100%}
.side{width:76px;background:linear-gradient(180deg,var(--navy),var(--navy2));display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;flex-shrink:0;overflow-y:auto}
.brand{width:38px;height:38px;border-radius:9px;background:var(--teal);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;margin-bottom:16px}
.nb{width:62px;padding:8px 2px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#A9BDBD;cursor:pointer;font-size:10.5px;margin-bottom:4px;border:0;background:transparent;text-align:center;line-height:1.25}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb:hover{background:rgba(255,255,255,.07);color:#E7F2F1}
.nb.on{background:var(--teal);color:var(--teal-ink);font-weight:700}
.nb .tag{font-size:9px;opacity:.75}
.grow{flex:1}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy3);color:#EAF5F3;border:2px solid var(--teal);font-size:12px;font-weight:700;margin-top:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.banner{background:var(--warn-bg);color:var(--warn);font-size:11.5px;padding:4px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.banner b{font-weight:700}
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:54px}
.top h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.who select{font-weight:700;color:var(--text)}
.page{flex:1;overflow:auto;padding:16px}
.wrap{max-width:1280px;margin:0 auto}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--navy3);border-color:var(--navy3);color:#fff;font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--soft);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12px;color:var(--mute);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:var(--mute)}
.tile .v{font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap}
.tile .s{font-size:11px;color:var(--faint)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--soft);color:var(--mute);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;color:var(--mute);background:var(--surface2);font-weight:700;position:sticky;top:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute)}
.f label input,.f label select,.f label textarea{width:100%}
.f .full{grid-column:1/-1}
.muted{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--faint);font-size:11.5px}
.note{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 10px;font-size:12px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}
.sub{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:12px 0;overflow-x:auto}
.sub button{border:0;background:transparent;padding:8px 14px;font-size:13px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.sub button.on{color:var(--text);font-weight:700;border-bottom-color:var(--teal)}
.sub button:disabled{opacity:.4}
/* 見積の表 */
.est td,.est th{padding:3px 5px}
.est tr.s td{background:var(--sell)}.est tr.c td{background:var(--cost);border-bottom:2px solid var(--border)}
.est td.nm input{width:230px}.est td.nm input.spec{width:230px;font-size:12px}
.est input.q{width:64px;text-align:right}.est input.p{width:84px;text-align:right}.est input.h{width:66px;text-align:right}
.est select.bun{width:64px;font-size:12px;padding:3px}
.est .tag{font-size:10.5px;color:var(--mute)}
.est td.ck{text-align:center;width:34px}
.est tr.auto td{font-weight:500}
.est tr.tot td{font-weight:700}
.hint{font-size:10.5px;color:var(--teal);display:block;line-height:1.2}
.gauge{height:10px;border-radius:99px;background:var(--soft);position:relative;overflow:hidden;min-width:120px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.gauge b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text)}
/* 書面 */
.paper{background:var(--paper);color:var(--paper-ink);max-width:760px;margin:0 auto;padding:28px 34px;box-shadow:var(--lift);font-family:"Zen Kaku Gothic New","Yu Mincho",serif;font-size:12.5px}
.paper h2{text-align:center;letter-spacing:.7em;font-size:22px;margin:4px 0 14px;font-weight:700}
.paper table{border:1px solid var(--paper-line)}
.paper th,.paper td{border:1px solid var(--paper-line);color:var(--paper-ink);background:var(--paper);padding:5px 7px;font-size:12px;position:static}
.paper .head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.paper .head>div{min-width:0}
.paper .u{border-bottom:1px solid var(--paper-line);padding:2px 0;margin-bottom:3px;display:flex;gap:6px}
.paper .u span:first-child{min-width:64px;font-weight:700}
.paper .amt{font-size:20px;font-weight:700;border-bottom:2px solid var(--paper-line);padding:6px 0;margin:12px 0}
/* カレンダー */
.cal th.d{text-align:center}.cal td{vertical-align:top;white-space:normal;min-width:112px;height:74px;border-right:1px solid var(--soft)}
.cal td.nm{position:sticky;left:0;background:var(--surface);z-index:1;min-width:120px;font-weight:700}
.cal td.today,.cal th.today{background:var(--info-bg)}
.cal td.we{background:var(--surface2)}
.tab{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--teal);background:var(--info-bg);color:var(--text);border-radius:5px;padding:2px 6px;margin-bottom:3px;font-size:11px;line-height:1.3}
.tab.lk{border-left-color:var(--faint);background:var(--soft)}.tab.ot{border-left-color:var(--coral)}.tab.nolink{border-left-style:dashed}
.tab .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--lift);width:min(720px,100%);padding:18px}
.modal.wide{width:min(1000px,100%)}
.modal h2{margin:0 0 12px;font-size:15px}
.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:9px 16px;border-radius:9px;font-size:12.5px;z-index:99;box-shadow:var(--lift);max-width:90vw}
.sl{display:flex;gap:14px}
.sl nav{width:170px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.sl nav button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--mute)}
.sl nav button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.sl .body{flex:1;min-width:0}
.mtx td,.mtx th{text-align:center}.mtx td:first-child,.mtx th:first-child{text-align:left}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right}
@media (max-width:760px){
  body{overflow:auto}.app{flex-direction:column-reverse;height:auto;min-height:100%}
  .side{width:100%;flex-direction:row;padding:6px;overflow-x:auto;position:sticky;bottom:0;z-index:20}
  .brand,.grow{display:none}.nb{width:auto;min-width:58px;margin:0 2px 0 0}.avatar{display:none}
  .page{padding:12px;overflow:visible}.sl{flex-direction:column}.sl nav{width:100%;flex-direction:row;overflow-x:auto}
  .top{padding:8px 12px}
}
@media print{.side,.top,.banner,.no-print{display:none!important}}

/* 見積：選択・階層・複数見積・確認表 */
.tw.tall{max-height:68vh;overflow:auto}
.mt th,.mt td{font-size:12px}
.est td.cb,.est th.cb{width:30px;text-align:center}
.est td.no{width:34px;text-align:center;color:var(--mute);font-size:12px}
.est tr.m td{background:var(--surface2)}
.est tr.sel td{background:var(--info-bg);box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--teal) 14%,transparent)}
.est textarea.ta{width:230px;resize:none;field-sizing:content;min-height:30px;font-size:13px;line-height:1.35;padding:4px 8px;overflow:hidden}
.est textarea.ta.wide{width:100%;min-width:420px}
.est td.nm .btn{margin-top:2px}
.estbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.estbar .ec{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.estbar .ec.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);font-weight:700}
.tb{margin-bottom:8px}
.selbar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:2px 0 8px}
.crumbs button{border:0;background:var(--soft);color:var(--text);border-radius:6px;padding:3px 10px;font-size:12px}
.crumbs button.on{background:var(--teal);color:var(--teal-ink);font-weight:700}
.est.chk td{white-space:nowrap}
.est.chk td:nth-child(2){white-space:normal;min-width:260px}
.est.chk tr.s td{background:var(--surface);border-bottom:1px solid var(--soft)}
.est.chk tr.grp td{background:var(--soft);font-weight:700}
.est.chk tr.tot td{background:var(--surface2);font-weight:700}
.est.chk tr.m td{background:var(--surface2)}
.paper td{vertical-align:top}
.est input.u{width:58px}

/* 行を黒い枠で囲む／ドラッグ／資料／チャット／担当者の選択 */
:root{--rowb:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rowb:#d5e0e3}}
:root[data-theme="dark"]{--rowb:#d5e0e3}
.est tr.s>td{border-top:2px solid var(--rowb)}
.est tr.c>td{border-bottom:2px solid var(--rowb)}
.est tr.m>td{border-top:2px solid var(--rowb);border-bottom:2px solid var(--rowb)}
.est td.cb{border-left:2px solid var(--rowb)}
.est td.dl{border-right:2px solid var(--rowb);text-align:center}
.est.chk td{border:1px solid var(--rowb)}
.est .dh{display:block;cursor:grab;color:var(--mute);font-size:15px;line-height:1;user-select:none}
.est .dh:active{cursor:grabbing}
.est tr.dragging td{opacity:.45}
.est tr.drop-before>td{box-shadow:inset 0 4px 0 var(--coral)}
.est tr.drop-after>td{box-shadow:inset 0 -4px 0 var(--coral)}
.est tr.drop-into>td{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--teal) 25%,transparent)}
.crumbs button.drop-into{outline:2px dashed var(--coral)}
.est select.docsel{font-size:11px;padding:2px;max-width:170px}
.ms{position:relative;max-width:420px}
.ms-b{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px}
.ms-p{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px}
.ms-p[hidden]{display:none}
.ms-q{width:100%;margin-bottom:6px}
.ms-list{max-height:220px;overflow:auto;display:flex;flex-direction:column}
.ms-i{display:flex;align-items:center;gap:6px;padding:5px 4px;font-size:13px;border-radius:6px;cursor:pointer}
.ms-i:hover{background:var(--soft)}
.ms-f{margin-top:6px;justify-content:flex-end}
a.flink{cursor:pointer;color:var(--text);font-weight:600}
a.flink:hover{color:var(--teal)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fcard{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.fth{display:flex;align-items:center;justify-content:center;height:100px;background:var(--soft);border-radius:8px;overflow:hidden;cursor:pointer}
.fth img{width:100%;height:100%;object-fit:cover}
.fic{font-size:38px}
.fn{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.fa{display:flex;gap:4px;flex-wrap:wrap}
.mbox{position:absolute;bottom:100%;left:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;min-width:220px}
.mbox[hidden]{display:none}
.mbox button{text-align:left;border:0;background:transparent;color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px}
.mbox button:hover{background:var(--soft)}
.mention{background:color-mix(in srgb,var(--teal) 22%,transparent);border-radius:4px;padding:0 3px;font-weight:700}
.mention.me{background:color-mix(in srgb,var(--coral) 30%,transparent)}
.cimg{max-width:260px;max-height:200px;border-radius:8px;display:block}


html{color-scheme:light}
.lg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);z-index:200;padding:16px}
.lgbox{background:var(--surface);color:var(--text);border-radius:16px;padding:28px 30px;width:min(340px,100%);box-shadow:var(--lift);display:flex;flex-direction:column;gap:12px}
.lgbrand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lgico{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--teal-ink)}
.lgbox h2{font-size:15px;margin:0}
.lgbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.lgbox input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.lgerr{display:none;color:var(--bad);font-size:12px}
.sync{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--good-bg);color:var(--good);cursor:pointer}
.sync[data-s=saving],.sync[data-s=loading]{background:var(--warn-bg);color:var(--warn)}

<script>
/* ===== ENGINE (計算ロジック：画面から独立。ここだけ単体テストできる) ===== */
const E = (function () {
  const EPS = 1e-9;
  function rnd(v, mode, unit) {
    unit = unit || 1; mode = mode || 'floor';
    const x = v / unit;
    let r;
    if (mode === 'ceil') r = Math.ceil(x - EPS);
    else if (mode === 'round') r = Math.round(x + EPS);
    else r = Math.floor(x + EPS);
    return r * unit;
  }
  const r3 = v => Math.round(v * 1e6) / 1e6;

  /* ---- 見積の計算（階層つき） ----
     est.rows = [行...]  行の種類:
       {type:'item', id,name,spec,unit,qty,cq(実行数量・空なら見積数量),sell,cost,hok,f:{経など},code,bun,mSell,mCost}
       {type:'group', id,name,children:[行...],f}       ← 階層（中の合計が親の金額になる）
       {type:'calc', kind:'col'|'labor'|'travel'|'sub'|'disc'|'tax'|'total', key,name,sell,cost,f,override}
       {type:'memo', text} / {type:'blank'}
     S: {round:{mode,unit}, discountUnit, taxRate, cols:[{key,label,rate}], minAmount}
  */
  function calcLevel(rows, S) {
    const R = v => rnd(v, S.round.mode, S.round.unit);
    const lines = [], pool = [];
    let amtS = 0, amtC = 0, hok = 0, segS = 0, segC = 0, taxS = 0, taxC = 0;
    const add = L => { amtS += L.sa; amtC += L.ca; segS += L.sa; segC += L.ca; };
    const sumF = (key, w) => pool.reduce((s, p) => s + (p.f && p.f[key] ? p[w] : 0), 0);
    rows.forEach(row => {
      const L = { row, type: row.type, sa: 0, ca: 0 };
      if (row.type === 'item') {
        const cq = (row.cq === null || row.cq === undefined || row.cq === '') ? row.qty : row.cq;
        L.qty = row.qty; L.cq = cq; L.sell = row.sell; L.cost = row.cost;
        L.sa = R(row.qty * row.sell); L.ca = R(cq * row.cost);
        hok += (row.hok || 0) * row.qty; add(L); pool.push({ sa: L.sa, ca: L.ca, f: row.f || {} });
      } else if (row.type === 'group') {
        const sub = calcLevel(row.children || [], S);
        L.sub = sub; L.sa = sub.amtS; L.ca = sub.amtC; L.qty = 1; L.cq = 1; L.sell = L.sa; L.cost = L.ca;
        hok += sub.hok; add(L); pool.push({ sa: L.sa, ca: L.ca, f: row.f || {} });
      } else if (row.type === 'calc') {
        const k = row.kind; L.kind = k; L.qty = 1; L.cq = 1;
        if (k === 'col') {
          const c = S.cols.find(x => x.key === row.key); const rate = (row.rate !== undefined && row.rate !== null) ? row.rate : (c ? c.rate : 0);
          L.rate = rate; L.baseS = sumF(row.key, 'sa'); L.baseC = sumF(row.key, 'ca');
          L.sa = R(L.baseS * rate); L.ca = R(L.baseC * rate); L.sell = L.sa; L.cost = L.ca; add(L); pool.push({ sa: L.sa, ca: L.ca, f: row.f || {} });
        } else if (k === 'labor') {
          const h = r3(hok); L.qty = h; L.cq = h; L.sell = row.sell; L.cost = row.cost;
          L.sa = R(row.sell * h); L.ca = R(row.cost * h); add(L); pool.push({ sa: L.sa, ca: L.ca, f: row.f || {} });
        } else if (k === 'travel') {
          L.sell = row.sell; L.cost = row.cost; L.sa = R(row.sell); L.ca = R(row.cost); add(L); pool.push({ sa: L.sa, ca: L.ca, f: row.f || {} });
        } else if (k === 'sub') { L.sa = segS; L.ca = segC; segS = 0; segC = 0; }
        else if (k === 'disc') {
          if (row.override !== null && row.override !== undefined && row.override !== '') L.sa = -Math.abs(Number(row.override) || 0);
          else if (S.discountUnit > 0) L.sa = Math.floor((amtS + EPS) / S.discountUnit) * S.discountUnit - amtS;
          L.ca = 0; add(L);
        } else if (k === 'tax') { L.sa = R(amtS * S.taxRate); L.ca = R(amtC * S.taxRate); taxS += L.sa; taxC += L.ca; }
        else if (k === 'total') { L.sa = amtS + taxS; L.ca = amtC + taxC; }
      }
      lines.push(L);
    });
    return { lines, amtS, amtC, hok: r3(hok), taxS, taxC };
  }
  function calcEstimate(est, S) {
    const L = calcLevel(est.rows, S);
    const R = v => rnd(v, S.round.mode, S.round.unit);
    const sub = L.amtS, costSub = L.amtC, tax = R(sub * S.taxRate), costTax = R(costSub * S.taxRate);
    const dl = L.lines.find(x => x.type === 'calc' && x.kind === 'disc');
    const gross = sub - costSub, margin = sub > 0 ? gross / sub : 0;
    return { lines: L.lines, L, sub, tax, total: sub + tax, costSub, costTax, costTotal: costSub + costTax, gross, margin, hokSum: L.hok, disc: dl ? dl.sa : 0, belowMin: sub < (S.minAmount || 0), hasItems: countItems(est.rows) > 0 };
  }
  function countItems(rows) { return rows.reduce((n, r) => n + (r.type === 'item' ? 1 : r.type === 'group' ? countItems(r.children || []) : 0), 0); }
  function walk(rows, fn, depth) { depth = depth || 0; rows.forEach(r => { fn(r, depth, rows); if (r.type === 'group') walk(r.children || [], fn, depth + 1); }); }
  function findRow(rows, id) { let out = null; (function f(arr) { arr.forEach(r => { if (out) return; if (r.id === id) out = { row: r, arr }; else if (r.type === 'group') f(r.children || []); }); })(rows); return out; }
  function findPath(rows, id, path) { path = path || []; for (const r of rows) { if (r.id === id) return path.concat([r.id]); if (r.type === 'group') { const p = findPath(r.children || [], id, path.concat([r.id])); if (p) return p; } } return null; }
  function rowsAt(est, path) { let rows = est.rows; (path || []).forEach(id => { const g = rows.find(r => r.id === id && r.type === 'group'); if (g) rows = g.children; }); return rows; }
  /* 階層を展開した一覧（原価確認表・書面の内訳用） */
  function flatten(lines, depth, out) { out = out || []; depth = depth || 0; lines.forEach(L => { if (L.type === 'group') { out.push({ L, depth, head: true }); flatten(L.sub.lines, depth + 1, out); } else out.push({ L, depth }); }); return out; }

  /* ---- 施工費の売単価を上げて目標利益率に届かせる ---- */
  function adjustLabor(est, S, target) {
    const e = JSON.parse(JSON.stringify(est)); let lab = null;
    walk(e.rows, r => { if (!lab && r.type === 'calc' && r.kind === 'labor') lab = r; });
    if (!lab) return { ok: false };
    const start = lab.sell;
    for (let i = 0; i < 3000; i++) { const c = calcEstimate(e, S); if (c.margin + 1e-12 >= target) return { sell: lab.sell, from: start, calc: c, ok: true }; lab.sell += 100; }
    return { sell: lab.sell, from: start, ok: false };
  }

  /* ---- 利益率表（原価帯で決まる目標） ---- */
  function targetMargin(cost, kind, S) {
    if (kind && S.kindMargin && S.kindMargin[kind] != null) return { rate: S.kindMargin[kind], why: S.kindLabel[kind] };
    const t = S.marginTable.slice().sort((a, b) => a.max - b.max);
    for (const r of t) if (cost <= r.max) return { rate: r.rate, why: '原価 ' + r.max.toLocaleString() + '円以下' };
    return { rate: null, why: '大型案件（利益率を個別に入力）' };
  }

  /* ---- 材料の単価参照（数量により単価が変わる） ---- */
  function tiers(hist) {
    const m = new Map();
    hist.filter(h => h.unit >= 0 && h.qty > 0).forEach(h => {
      const k = h.qty; const cur = m.get(k);
      if (!cur || h.date > cur.date) m.set(k, h);
    });
    return Array.from(m.values()).sort((a, b) => a.qty - b.qty);
  }
  function lookupTier(hist, qty) {
    const t = tiers(hist); if (!t.length) return null;
    let pick = null;
    t.forEach(x => { if (x.qty <= qty) pick = x; });
    return pick || t[0];
  }

  /* ---- 勤務時間の分類（案件タブ → 定時/残業/深夜/休日） ---- */
  const tmin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  function isHoliday(d, W) {
    const wd = new Date(d + 'T00:00:00').getDay();
    return (wd === 0 || wd === 6) || (W.holidays || []).includes(d);
  }
  function classify(tabs, W, seen) {
    const out = { '定時': 0, '残業': 0, '深残': 0, '休日': 0, '深残（休日）': 0, ignored: 0 };
    seen = seen || new Set();
    const ws = tmin(W.start), we = tmin(W.end), bs = tmin(W.breakStart), be = tmin(W.breakEnd);
    tabs.forEach(t => {
      const s = tmin(t.start), e = tmin(t.end), hol = isHoliday(t.date, W);
      for (let m = s; m < e; m++) {
        const k = t.date + '|' + m; if (seen.has(k)) continue; seen.add(k);
        const inBreak = m >= bs && m < be;
        if (!hol && m >= ws && m < we) { if (!inBreak) out['定時']++; continue; }
        if (!t.ot) { out.ignored++; continue; }
        const night = m >= 22 * 60 || m < 5 * 60;
        if (hol && night) out['深残（休日）']++;
        else if (hol) out['休日']++;
        else if (night) out['深残']++;
        else out['残業']++;
      }
    });
    return out;   // 分単位
  }
  function laborAmount(mins, wage, mult) {
    let sum = 0, hours = 0;
    Object.keys(mult).forEach(k => { const h = (mins[k] || 0) / 60; hours += h; sum += h * wage * mult[k]; });
    return { amount: Math.round(sum), hours };
  }

  return { rnd, calcLevel, calcEstimate, walk, findRow, findPath, rowsAt, flatten, countItems, targetMargin, adjustLabor, tiers, lookupTier, classify, laborAmount, tmin, isHoliday };
})();

  const mine=t.staff===ST.uid, editable=!t.id?(can('cal.editAll')||mine):((can('cal.editAll')||mine)&&(!t.locked||can('history.edit')));
  if(!t.id&&!can('cal.editAll')&&!mine){toast('自分以外の案件タブは editor 以上で作成できます');return}
  const cs=visibleCases();
  const opts=(q)=>'<option value="">（案件に紐づけない）</option>'+cs.filter(c=>!q||(c.no+c.name).includes(q)).map(c=>'<option value="'+c.id+'"'+(c.id===t.caseId?' selected':'')+'>'+c.no+'　'+esc(c.name)+'</option>').join('');
  openModal('<h2>'+(t.id?'案件タブを編集':'案件タブを作成')+(t.locked?' <span class="chip">日報として確定済み</span>':'')+'</h2>'+
   (t.locked&&!can('history.edit')?'<div class="note warn" style="margin-bottom:10px">確定済みの日報です。変更は admin 以上が行います。</div>':'')+
   '<div class="f"><label>担当者<select id="tf-staff"'+(can('cal.editAll')&&editable?'':' disabled')+'>'+USERS.map(u=>'<option value="'+u.id+'"'+(u.id===t.staff?' selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select></label>'+
   '<label>日付<input type="date" id="tf-date" value="'+t.date+'"'+(editable?'':' disabled')+'></label>'+
   '<label>開始<input type="time" id="tf-start" value="'+t.start+'"'+(editable?'':' disabled')+'></label><label>終了<input type="time" id="tf-end" value="'+t.end+'"'+(editable?'':' disabled')+'></label>'+
   '<label class="full">案件詳細と紐づけ（案件番号・案件名で絞り込み）<input id="tf-filter" placeholder="例：0039 / LED" '+(editable?'':'disabled')+'><select id="tf-case" size="1"'+(editable?'':' disabled')+'>'+opts('')+'</select></label>'+
   '<label class="full">表示名（空欄なら案件名）<input id="tf-title" value="'+esc(t.title)+'"'+(editable?'':' disabled')+'></label>'+
   '<label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="tf-ot"'+(t.ot?' checked':'')+(editable?'':' disabled')+'> 時間外労働（通常の勤務時間・出勤日以外。給与計算に反映する）</label></div>'+
   '<div id="tf-hint" class="note" style="margin-top:10px"></div>'+
   '<div class="act">'+(t.id&&editable?'<button class="btn danger" data-a="tabDel" data-id="'+t.id+'">削除</button>':'')+'<span style="flex:1"></span><button class="btn" data-a="close">閉じる</button>'+(editable?'<button class="btn pri" data-a="tabSave" data-id="'+(t.id||'')+'">保存</button>':'')+'</div>');
  window._caseOpts=opts; tabHint();
}
function tabHint(){ const g=id=>{const e=$('#'+id);return e?e.value:''}; if(!$('#tf-hint'))return; const s=g('tf-start'),e=g('tf-end'),d=g('tf-date'); const ot=$('#tf-ot').checked;
  if(!s||!e||e<=s){$('#tf-hint').textContent='開始と終了を入力してください（日をまたぐ入力は通常勤務時間内で処理する仕様のため、このプレビューでは同日内のみ）。';return}
  const m=E.classify([{date:d,start:s,end:e,ot}],SET.work); const parts=CAT_ORDER.filter(k=>m[k]).map(k=>k+' '+(m[k]/60).toFixed(2)+'h');
  $('#tf-hint').className='note'+(m.ignored?' warn':''); $('#tf-hint').innerHTML='給与計算への反映：'+(parts.join(' ／ ')||'なし')+(m.ignored?'<br>通常の勤務時間・出勤日の外 '+(m.ignored/60).toFixed(2)+'h は、「時間外労働」にチェックするまで給与計算に反映されません。':'');
}
function pageEq(){ return '<div class="card"><h3>設備管理</h3><p class="muted">現行の「設備管理」画面をそのまま使います。このプレビューでは変更していません。</p><p class="small muted">案件詳細との紐づけは、設備予約の「案件」プルダウンで、案件詳細の一覧から選ぶ形に揃える想定です。</p></div>'; }

/* ===== 画面：案件詳細（一覧・概要・お客様・見積・原価と利益・添付・チャット） ===== */
function nextNo(){ const n=CASES.map(c=>c.no).filter(x=>x.startsWith('0059')).map(Number); return String((n.length?Math.max(...n):59000000)+1).padStart(10,'0'); }
function laborLines(caseId){
  const out=[];
  USERS.forEach(u=>{ const seen=new Set(); const acc={};
    TABS.filter(t=>t.staff===u.id).sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1).forEach(t=>{ const m=E.classify([t],SET.work,seen); if(t.caseId===caseId) CAT_ORDER.forEach(k=>acc[k]=(acc[k]||0)+m[k]); });
    CAT_ORDER.forEach(k=>{ if(acc[k]) out.push({staff:u.id,cat:k,hours:acc[k]/60,wage:u.wage,mult:SET.costMult[k],amount:Math.round(acc[k]/60*u.wage*SET.costMult[k])}); }); });
  return out;
}
function caseCost(c){ const by={'材料':0,'労務':0,'外注':0,'経費':0}; c.costs.forEach(l=>by[l.cat]+=l.amount); const ll=laborLines(c.id); const lab=ll.reduce((s,x)=>s+x.amount,0); by['労務']+=lab; return {by,total:by['材料']+by['労務']+by['外注']+by['経費'],ll,lab}; }
function caseRev(c){ const nyuukin=c.received>0; let rev=nyuukin?c.received:c.contract; if(nyuukin&&SET.receivedTaxIncl)rev=rev/(1+SET.taxRate); return {basis:nyuukin?'入金額':'契約額',rev}; }
function caseMargin(c){ const k=caseCost(c), r=caseRev(c); return {cost:k,rev:r,margin:r.rev>0?(r.rev-k.total)/r.rev:null}; }
const stChip=s=>'<span class="chip '+({'受注':'info','施工中':'good','完了':'','見積中':'warn','保留':'','失注':'bad'}[s]||'')+'">'+s+'</span>';

const ordered=c=>{ const o=c.ests.filter(e=>e.status==='受注'); return o.length?o:[curEst(c)]; };
const orderedSub=c=>c.ests.filter(e=>e.status==='受注').reduce((s,e)=>s+E.calcEstimate(e,SET).sub,0);

  if(!can('case.editAll')) h+='<div class="note" style="margin-bottom:10px">自分のアカウントに紐づけられた案件だけが表示されます。</div>';
  h+='<div class="tw"><table><thead><tr><th>案件番号</th><th>案件名</th><th>区分</th><th>部門</th><th>状態</th><th>営業</th><th>工事</th>'+(can('cost.view')?'<th class="r">契約額（税抜）</th><th class="r">利益率</th>':'')+'</tr></thead><tbody>';

function caseDetail(c){
  const tabs=[['ov','概要'],['cust','お客様'],['est','見積'],['prof','原価と利益'],['files','資料'],['chat','チャット']];
  const ok=k=>k==='ov'||k==='cust';
  if(!ok(ST.caseTab))ST.caseTab='ov';
  let h='<div class="row" style="margin-bottom:6px"><button class="btn sm" data-a="caseBack">◀ 一覧へ</button><span class="chip info num">'+c.no+'</span><b style="font-size:16px">'+esc(c.name)+'</b>'+stChip(c.status)+(c.kind?'<span class="chip">'+esc(kindName(c.kind))+'</span>':'')+'<span class="chip">'+esc(deptName(c.dept))+'</span>'+'</div>';
  h+='<div class="sub">'+tabs.map(t=>'<button class="'+(ST.caseTab===t[0]?'on':'')+'" data-a="caseTab" data-v="'+t[0]+'"'+(ok(t[0])?'':' disabled title="次の段階で対応します"')+'>'+t[1]+(ok(t[0])?'':' 🔒')+'</button>').join('')+'</div>';
  const B={ov:tabOv,cust:tabCust,est:tabEst,prof:tabProf,files:tabFiles,chat:tabChat};
  return h+B[ST.caseTab](c);
}

   '<div class="full"><div class="small muted" style="margin-bottom:4px">この案件に紐づけるアカウント（プルダウンで名前検索・複数選択。その日の作業者はカレンダーの案件タブで決まります）</div>'+msel(c,ed)+'</div></div></div>'+
   (can('cost.view')?'<div class="card"><h3>契約・入金</h3><div class="f">'+inp(c,'contract','契約額（税抜）','number',!ed)+inp(c,'received','入金合計額','number',!ed)+'</div><div class="row" style="margin-bottom:8px"><span class="small">受注した見積の合計（税抜）：<b class="num">'+yen(orderedSub(c))+'</b></span>'+(ed&&orderedSub(c)>0?'<button class="btn sm" data-a="useOrdered" data-id="'+c.id+'">契約額に反映</button>':'')+'</div><p class="small muted">入金がある案件は入金額、ない案件は契約額を売上として利益率を計算します（入金額の税の扱いは設定で切り替え）。</p></div>':'')+'</div>'; }
function tabCust(c){ return '<div class="card"><h3>お客様情報</h3><div class="f">'+inp(c,'cust.name','お客様名','text')+inp(c,'cust.contact','ご担当（宛名）','text')+inp(c,'cust.zip','郵便番号','text')+inp(c,'cust.addr','住所','text')+inp(c,'cust.tel','電話','text')+'</div></div>'; }

/* 原価と利益 */
function tabProf(c){
  const m=caseMargin(c), w=can('wage.view'); const es=ordered(c).map(e=>E.calcEstimate(e,SET));
  const r={sub:es.reduce((s,x)=>s+x.sub,0),costSub:es.reduce((s,x)=>s+x.costSub,0)}; r.margin=r.sub>0?(r.sub-r.costSub)/r.sub:0; const hasEst=es.some(x=>x.hasItems);
  const estBy={'材料':0,'労務':0,'外注':0,'経費':0}; es.forEach(x=>E.flatten(x.lines).forEach(f=>{ const L=f.L; if(f.head||L.type==='group'||L.type!=='item'&&L.type!=='calc')return; if(L.type==='item')estBy['材料']+=L.ca; else if(L.kind==='labor')estBy['労務']+=L.ca; else if(L.kind==='travel'||(L.kind==='col'&&L.row.key==='keihi'))estBy['経費']+=L.ca; else if(L.kind==='col')estBy['材料']+=L.ca; }));
  const basis=ordered(c).map(e=>e.name).join('＋'); const tg=hasEst?E.targetMargin(r.costSub,c.kind,SET):null;
  let h='<div class="grid g4" style="margin-bottom:12px"><div class="tile"><div class="k">売上（'+m.rev.basis+'・税抜換算）</div><div class="v num">'+(m.rev.rev?yen(m.rev.rev):'—')+'</div><div class="s">契約額 '+yen(c.contract)+' ／ 入金 '+yen(c.received)+'</div></div><div class="tile"><div class="k">実績の原価</div><div class="v num">'+yen(m.cost.total)+'</div><div class="s">材料・労務・外注・経費の合計</div></div><div class="tile"><div class="k">実績の利益率</div><div class="v num">'+(m.margin==null?'—':pct(m.margin))+'</div><div class="s">粗利 '+(m.rev.rev?yen(m.rev.rev-m.cost.total):'—')+'</div></div><div class="tile"><div class="k">見積時の利益率</div><div class="v num">'+(hasEst?pct(r.margin):'—')+'</div><div class="s">'+(hasEst?'目標 '+(tg.rate==null?'個別':pct(tg.rate,0))+'／対象：'+esc(basis):'見積が未作成')+'</div></div></div>';
  h+='<div class="grid g2"><div class="card"><h3>見積と実績の比較（原価）</h3><div class="tw"><table><thead><tr><th>区分</th><th class="r">見積（実行）</th><th class="r">実績</th><th class="r">差</th></tr></thead><tbody>'+['材料','労務','外注','経費'].map(k=>'<tr><td>'+k+'</td><td class="r num">'+num(estBy[k])+'</td><td class="r num">'+num(m.cost.by[k])+'</td><td class="r num" style="color:'+(m.cost.by[k]-estBy[k]>0?'var(--bad)':'var(--good)')+'">'+num(m.cost.by[k]-estBy[k])+'</td></tr>').join('')+'<tr class="tot"><td><b>合計</b></td><td class="r num"><b>'+num(r.costSub)+'</b></td><td class="r num"><b>'+num(m.cost.total)+'</b></td><td class="r num"><b>'+num(m.cost.total-r.costSub)+'</b></td></tr></tbody></table></div><p class="small faint">実績の「労務」は、案件カレンダーの案件タブ（日報）の時間×個人の時給から自動で入ります。</p></div>';
  h+='<div class="card"><h3>労務費の内訳（個人別の時給）</h3>'+(w?'<div class="tw"><table><thead><tr><th>担当</th><th>区分</th><th class="r">時間</th><th class="r">時給</th><th class="r">掛け率</th><th class="r">金額</th></tr></thead><tbody>'+(m.cost.ll.map(x=>'<tr><td>'+esc(uname(x.staff))+'</td><td>'+x.cat+'</td><td class="r num">'+x.hours.toFixed(2)+'</td><td class="r num">'+num(x.wage)+'</td><td class="r num">'+x.mult+'</td><td class="r num">'+num(x.amount)+'</td></tr>').join('')||'<tr><td colspan="6" class="muted">この案件に紐づく案件タブがありません。</td></tr>')+'</tbody></table></div>':'<div class="lock">🔒 個別の時給と内訳は leader 以上が見られます</div><p>労務費の合計：<b class="num">'+yen(m.cost.by['労務'])+'</b></p>')+'</div></div>';
  h+='<div class="row" style="margin:12px 0 6px"><h3 style="margin:0">原価の明細</h3><span style="flex:1"></span><button class="btn" data-a="costAdd" data-id="'+c.id+'">＋ 原価を手入力（納品書など）</button></div><div class="tw"><table><thead><tr><th>日付</th><th>区分</th><th>分</th><th>品名</th><th class="r">数量</th><th class="r">単価</th><th class="r">金額</th><th>出所</th></tr></thead><tbody>'+(c.costs.map(l=>'<tr><td>'+l.date+'</td><td>'+l.cat+'</td><td>'+(l.bun||'')+'</td><td>'+esc(l.name)+'</td><td class="r num">'+l.qty+'</td><td class="r num">'+num(l.price)+'</td><td class="r num" style="'+(l.amount<0?'color:var(--bad)':'')+'">'+num(l.amount)+'</td><td><span class="chip">'+l.src+'</span></td></tr>').join('')||'<tr><td colspan="8" class="muted">明細がありません。</td></tr>')+'</tbody></table></div><p class="small faint">マイナスの金額（返品・調整）はそのまま残り、利益率に反映されます。</p>';
  return h;
}

/* ===== 画面：見積（複数見積・階層・原価計算画面／原価確認表／書面）と行の操作 ===== */
const estChip=s=>'<span class="chip '+({'受注':'good','失注':'bad','検討中':'warn','提出済':'info'}[s]||'')+'">'+esc(s)+'</span>';
const CALC_NAME={labor:'施工費',travel:'出張費',disc:'出精値引き',sub:'小　計',total:'合　計'};
function calcName(row){ if(row.label)return row.label; if(row.kind==='col'){const k=SET.cols.find(x=>x.key===row.key);return k?k.rowName:row.key} if(row.kind==='tax')return '消費税 '+pct(SET.taxRate,0); return CALC_NAME[row.kind]||''; }
const r3=v=>Math.round(v*1000)/1000;
function levelAt(r,path){ let L=r.L; for(const id of path){ const g=L.lines.find(x=>x.row.id===id&&x.type==='group'); if(!g)return null; L=g.sub; } return L; }
function validPath(e){ let rows=e.rows; for(let i=0;i<ST.estPath.length;i++){ const g=rows.find(x=>x.id===ST.estPath[i]&&x.type==='group'); if(!g){ST.estPath=ST.estPath.slice(0,i);return} rows=g.children; } }
const levelRows=c=>E.rowsAt(curEst(c),ST.estPath);

/* ---------- 取り消し（戻す） ---------- */
const HIST={}, REDO={};
const stateOf=c=>JSON.stringify({ests:c.ests,estId:c.estId});
function snap(c){ const h=(HIST[c.id]=HIST[c.id]||[]); h.push(stateOf(c)); if(h.length>60)h.shift(); REDO[c.id]=[]; }
function restore(c,js){ const o=JSON.parse(js); c.ests=o.ests; c.estId=o.estId; ST.sel={}; validPath(curEst(c)); }
function undo(c){ const h=HIST[c.id]; if(!h||!h.length){toast('戻せる操作がありません');return} (REDO[c.id]=REDO[c.id]||[]).push(stateOf(c)); restore(c,h.pop()); toast('ひとつ前の状態に戻しました'); render(); }
function redo(c){ const r=REDO[c.id]; if(!r||!r.length){toast('進める操作がありません');return} (HIST[c.id]=HIST[c.id]||[]).push(stateOf(c)); restore(c,r.pop()); toast('やり直しました'); render(); }
document.addEventListener('keydown',e=>{ if(!(e.ctrlKey||e.metaKey))return; const k=e.key.toLowerCase(); if(k!=='z'&&k!=='y')return; if(ST.tab!=='case'||ST.caseTab!=='est'||!ST.caseId)return; if(document.getElementById('ov'))return;
  const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&t.type!=='checkbox'&&t.value!==t.defaultValue)return;   // 入力途中の文字は、ブラウザ標準の取り消しに任せる
  e.preventDefault(); const c=curCase(); if(!c)return; if(k==='y'||(k==='z'&&e.shiftKey))redo(c); else undo(c); });

/* ---------- 行の追加・複製・フィールド更新 ---------- */
function cloneRow(r){ const n=JSON.parse(JSON.stringify(r)); (function f(x){ x.id=uid(); if(x.children)x.children.forEach(f); })(n); return n; }
function newRowOf(kind){
  if(kind==='item')return blankItem();
  if(kind==='group')return {type:'group',id:uid(),name:'新しい階層',children:[],f:Object.assign({},F2)};
  if(kind==='memo')return {type:'memo',id:uid(),text:''};
  if(kind==='blank')return {type:'blank',id:uid()};
  if(kind==='sub')return {type:'calc',kind:'sub',id:uid()};
  if(kind==='mid')return {type:'calc',kind:'sub',id:uid(),label:'中　計'};
  if(kind==='labor')return {type:'calc',kind:'labor',id:uid(),sell:SET.laborSell,cost:SET.laborCost,f:{keihi:true}};
  if(kind==='travel')return {type:'calc',kind:'travel',id:uid(),sell:SET.travelSell,cost:SET.travelCost,f:{keihi:true}};
  if(kind==='disc')return {type:'calc',kind:'disc',id:uid(),override:null};
  if(kind==='tax'||kind==='total')return {type:'calc',kind,id:uid()};
  if(kind.startsWith('col:')){ const k=SET.cols.find(x=>x.key===kind.slice(4)); return {type:'calc',kind:'col',key:k.key,id:uid(),f:(k.rowFlags||[]).reduce((m,x)=>(m[x]=true,m),{})}; }
  return blankItem();
}
function defaultIdx(rows,kind){ let li=-1; rows.forEach((r,i)=>{ if(r.type==='item'||r.type==='group')li=i; });
  if(['item','group','memo','blank','sub','mid'].includes(kind))return li+1;
  if(kind==='tax'||kind==='total')return rows.length;
  for(let j=li+1;j<rows.length;j++){ const r=rows[j]; if(r.type==='calc'&&['disc','sub','tax','total'].includes(r.kind))return j; } return rows.length; }
function insertRows(c,rows,newRows,kind){ const sel=rows.map((r,i)=>ST.sel[r.id]?i:-1).filter(i=>i>=0);
  const idx=sel.length?sel[sel.length-1]+1:defaultIdx(rows,kind||'item'); rows.splice(idx,0,...newRows); }
function repriceCost(row){ if(row.code&&!row.mCost){ const m=MATS.find(y=>y.code===row.code); const q=(row.cq==null||row.cq==='')?row.qty:row.cq; const t=m&&E.lookupTier(m.hist,q); if(t)row.cost=t.unit; }
  if(!row.mSell)row.sell=Math.round(row.cost/(1-SET.baseMargin)); }
function setField(row,col,v){
  const nm=x=>{ const n=Number(String(x).replace(/[,¥￥\s]/g,'')); return isFinite(n)?n:0 };
  if(col==='gname'){row.name=v;return} if(col==='doc'){row.doc=v;return} if(col==='text'){row.text=v;return} if(col==='lbl'){row.label=v;return}
  if(col==='disc'){row.override=String(v).trim()===''?null:Math.abs(nm(v));return}
  if(col==='rsell'){row.sell=nm(v);return} if(col==='rcost'){row.cost=nm(v);return}
  if(row.type!=='item')return;
  if(col==='bun'){row.bun=v;return}
  if(col==='name'||col==='unit'||col==='spec'){row[col]=v;return}
  const x=nm(v);
  if(col==='qty'){row.qty=x;repriceCost(row)}
  else if(col==='cq'){row.cq=(x===row.qty)?null:x;repriceCost(row)}
  else if(col==='sell'){row.sell=x;row.mSell=true}
  else if(col==='cost'){row.cost=x;row.mCost=true;if(!row.mSell)row.sell=Math.round(row.cost/(1-SET.baseMargin))}
  else if(col==='hok'){row.hok=x}
}

/* ---------- 見積のまとめ（金額・利益率・目標） ---------- */
function estSummary(c,e,r){
  const t=E.targetMargin(r.costSub,c.kind,SET); const man=e.manualTarget;
  const target=t.rate!=null?t.rate:(man!=null&&man!==''?Number(man)/100:null); const ok=target!=null&&r.margin+1e-9>=target;
  let adj=null; if(target!=null&&!ok&&r.hasItems)adj=E.adjustLabor(e,SET,target);
  const gp=Math.min(100,Math.max(0,r.margin*100*1.4)), tp=target==null?0:Math.min(100,target*100*1.4);
  return '<div class="card" style="margin-bottom:12px"><div class="grid g4"><div class="tile"><div class="k">見積金額（税込）</div><div class="v num">'+yen(r.total)+'</div><div class="s">税抜 '+yen(r.sub)+'</div></div><div class="tile"><div class="k">原価（税抜）</div><div class="v num">'+yen(r.costSub)+'</div><div class="s">税込 '+yen(r.costTotal)+'</div></div><div class="tile"><div class="k">粗利（税抜）</div><div class="v num">'+yen(r.gross)+'</div></div><div class="tile"><div class="k">利益率</div><div class="v num" style="color:'+(ok?'var(--good)':target==null?'var(--text)':'var(--bad)')+'">'+pct(r.margin)+'</div><div class="s">目標 '+(target==null?'未設定':pct(target,0))+'（'+esc(t.why)+'）</div></div></div>'+
   '<div class="row" style="margin-top:10px"><div class="gauge" style="flex:1" title="棒が目標"><i style="width:'+gp+'%;background:'+(ok?'var(--good)':'var(--coral)')+'"></i>'+(target==null?'':'<b style="left:'+tp+'%"></b>')+'</div>'+(target==null?'':'<span class="chip '+(ok?'good':'bad')+'">'+(ok?'目標を達成':'目標まで '+((target-r.margin)*100).toFixed(1)+'pt 不足')+'</span>')+
   (t.rate==null?'<label class="small muted">大型案件の目標利益率 <input type="number" style="width:70px" data-c="manualTarget" data-f="mt" value="'+esc(e.manualTarget==null?'':e.manualTarget)+'" placeholder="例 20"> %</label>':'')+'</div>'+
   (adj&&adj.ok?'<div class="note warn" style="margin-top:8px">施工費の売上単価（1人工）を '+yen(adj.from)+' → '+yen(adj.sell)+' にすると目標（'+pct(target,0)+'）に届きます。 <button class="btn sm" data-a="applyAdj" data-v="'+adj.sell+'">施工費で調整する</button></div>':'')+
   (r.belowMin&&r.hasItems?'<div class="note bad" style="margin-top:8px">見積の最小金額（'+yen(SET.minAmount)+'・税別）を下回っています。</div>':'')+'</div>';
}

function tabEst(c){
  const e=curEst(c); validPath(e); const r=E.calcEstimate(e,SET);

function doSel(c,op){
  const e=curEst(c), rows=levelRows(c), idx=rows.map((r,i)=>ST.sel[r.id]?i:-1).filter(i=>i>=0);
  if(!op){toast('「選択した行を…」から操作を選んでください');return}
  if(!idx.length){toast('先に行を選択してください（No の左のチェック）');return}
  if(op==='send'){openSend(c);return}
  if(op==='del'){confirmBox(idx.length+'行を削除します。「↩ 戻す」で元に戻せます。','削除する',()=>{ snap(c); const s=new Set(idx); const keep=rows.filter((_,i)=>!s.has(i)); rows.splice(0,rows.length,...keep); ST.sel={}; render(); }); return}
  const sel=ST.sel;
  if(op==='out'&&!ST.estPath.length){toast('最上位の行には、ひとつ上の階層がありません');return}
  snap(c);
  if(op==='dup'){ const out=[]; rows.forEach(r=>{out.push(r); if(sel[r.id])out.push(cloneRow(r));}); rows.splice(0,rows.length,...out); toast(idx.length+'行をコピーしました'); }
  else if(op==='up'){ for(let k=1;k<rows.length;k++) if(sel[rows[k].id]&&!sel[rows[k-1].id]){const t=rows[k];rows[k]=rows[k-1];rows[k-1]=t;} }
  else if(op==='down'){ for(let k=rows.length-2;k>=0;k--) if(sel[rows[k].id]&&!sel[rows[k+1].id]){const t=rows[k];rows[k]=rows[k+1];rows[k+1]=t;} }
  else if(op==='group'){ const picked=idx.map(i=>rows[i]); const g={type:'group',id:uid(),name:'新しい階層',children:picked,f:Object.assign({},F2)}; const keep=rows.filter((_,i)=>!idx.includes(i)); const first=idx[0]; keep.splice(first,0,g); rows.splice(0,rows.length,...keep); ST.sel={}; toast('階層にまとめました。名称を入力して、「開く ▸」で中を編集できます'); }
  else if(op==='out'){ const par=E.rowsAt(e,ST.estPath.slice(0,-1)); const gid=ST.estPath[ST.estPath.length-1]; const gi=par.findIndex(x=>x.id===gid); const picked=idx.map(i=>rows[i]); const keep=rows.filter((_,i)=>!idx.includes(i)); rows.splice(0,rows.length,...keep); par.splice(gi+1,0,...picked); ST.sel={}; toast(picked.length+'行をひとつ上の階層へ出しました'); }
  else if(op==='ungroup'){ const out=[]; let n=0; rows.forEach(r=>{ if(sel[r.id]&&r.type==='group'){ out.push(...(r.children||[])); n++; } else out.push(r); }); rows.splice(0,rows.length,...out); ST.sel={}; toast(n?n+'個の階層を解除しました':'階層の行が選ばれていません'); }
  ST.selOp=''; render();
}

/* ===== 資料（フォルダ・ファイル）／チャット／担当者の複数選択／行のドラッグ移動 ===== */
const ACT5={redo(el){redo(caseById(el.dataset.id))}}, CH5={};
const todayS=()=>iso(TODAY).replace(/-/g,'/');
const isImg=f=>(f.mime||'').startsWith('image/')||/\.(png|jpe?g|gif|webp|heic)$/i.test(f.name||'');
function fileIcon(f){ if(f.type==='folder')return '📁'; const n=(f.name||'').toLowerCase(); if(isImg(f))return '🖼'; if(n.endsWith('.pdf'))return '📕'; if(/\.(xlsx?|csv)$/.test(n))return '📊'; if(/\.docx?$/.test(n))return '📝'; return '📄'; }
const kb=s=>s>=1048576?(s/1048576).toFixed(1)+' MB':Math.max(1,Math.round(s/1024))+' KB';
function defFiles(){ const mk=n=>({id:uid(),type:'folder',name:n,parent:null,by:'',added:'',updated:''}); return [mk('01_図面'),mk('02_仕様'),mk('03_工程')]; }
function fdirOf(c){ const id=(ST.fdir||{})[c.id]||null; return id&&c.files.some(x=>x.id===id&&x.type==='folder')?id:null; }
function fpath(c,id){ const out=[]; let cur=id; while(cur){ const f=c.files.find(x=>x.id===cur); if(!f)break; out.unshift(f); cur=f.parent; } return out; }
function fdesc(c,id){ const s=new Set([id]); let ch=true; while(ch){ ch=false; c.files.forEach(f=>{ if(f.parent&&s.has(f.parent)&&!s.has(f.id)){s.add(f.id);ch=true} }); } return s; }

function tabFiles(c){
  const cur=fdirOf(c), q=(ST.fq||'').trim().toLowerCase(), view=ST.fview||'list';
  let items=q?c.files.filter(f=>f.name.toLowerCase().includes(q)):c.files.filter(f=>(f.parent||null)===cur);
  items=items.slice().sort((a,b)=>(a.type===b.type?0:a.type==='folder'?-1:1)||a.name.localeCompare(b.name,'ja'));
  const path=fpath(c,cur);
  let h='<div class="card"><div class="row" style="margin-bottom:10px"><label class="btn pri" style="cursor:pointer">＋ 資料を追加する<input type="file" id="fileIn" multiple hidden></label><button class="btn pri" data-a="fMk" data-id="'+c.id+'">＋ フォルダを追加する</button><span class="small muted">画像・PDF・Excelなど（動画は不可）。プレビューでは保存されません。</span></div>';
  h+='<div class="row" style="margin-bottom:8px"><input data-c="fq" data-f="fq" placeholder="ファイル名・フォルダ名で検索" value="'+esc(ST.fq||'')+'" style="width:min(300px,100%)"><span style="flex:1"></span><div class="seg"><button class="'+(view==='list'?'on':'')+'" data-a="fView" data-v="list">リスト表示</button><button class="'+(view==='card'?'on':'')+'" data-a="fView" data-v="card">カード表示</button></div></div>';
  h+='<div class="crumbs"><button data-a="fOpen" data-id="" class="'+(cur?'':'on')+'">資料</button>'+path.map((f,i)=>' › <button data-a="fOpen" data-id="'+f.id+'" class="'+(i===path.length-1?'on':'')+'">'+esc(f.name)+'</button>').join('')+(q?'<span class="small faint">　検索中：すべてのフォルダから探しています</span>':'')+'</div>';
  const act=f=>'<button class="btn sm" data-a="fRen" data-id="'+f.id+'">名前変更</button> <button class="btn sm" data-a="fMove" data-id="'+f.id+'">移動</button> <button class="btn sm danger" data-a="fDel" data-id="'+f.id+'">削除</button>';
  const where=f=>q&&f.parent?'<div class="small faint">'+esc(fpath(c,f.parent).map(x=>x.name).join(' / '))+'</div>':'';
  const open=f=>f.type==='folder'?'data-a="fOpen" data-id="'+f.id+'"':'data-a="fPrev" data-id="'+f.id+'"';
  if(!items.length)h+='<p class="muted small" style="padding:10px 0">'+(q?'該当する項目がありません。':'このフォルダは空です。「＋ 資料を追加する」か、ここにフォルダを作れます。')+'</p>';
  else if(view==='list')h+='<div class="tw"><table><thead><tr><th>項目</th><th class="r">項目数</th><th>公開範囲</th><th>追加者</th><th>追加日時</th><th>最終更新日時</th><th></th></tr></thead><tbody>'+items.map(f=>'<tr><td><a class="flink" '+open(f)+'>'+fileIcon(f)+' '+esc(f.name)+'</a>'+where(f)+'</td><td class="r num">'+(f.type==='folder'?c.files.filter(x=>x.parent===f.id).length+'個':kb(f.size||0))+'</td><td>全体</td><td>'+esc(f.by||'')+'</td><td class="num">'+esc(f.added||'')+'</td><td class="num">'+esc(f.updated||'')+'</td><td class="r" style="white-space:nowrap">'+act(f)+'</td></tr>').join('')+'</tbody></table></div>';
  else h+='<div class="fgrid">'+items.map(f=>'<div class="fcard"><a class="fth" '+open(f)+'>'+(f.url&&isImg(f)?'<img src="'+f.url+'" alt="">':'<span class="fic">'+fileIcon(f)+'</span>')+'</a><div class="fn">'+esc(f.name)+'</div><div class="small faint">'+(f.type==='folder'?c.files.filter(x=>x.parent===f.id).length+'個':kb(f.size||0))+'　'+esc(f.updated||'')+'</div><div class="fa">'+act(f)+'</div></div>').join('')+'</div>';
  return h+'</div>';
}
Object.assign(ACT5,{
  fView(el){ST.fview=el.dataset.v;render()},
  fOpen(el){ST.fdir=Object.assign({},ST.fdir,{[curCase().id]:el.dataset.id||null});ST.fq='';render()},
  fMk(el){ openModal('<h2>フォルダを追加</h2><div class="f"><label class="full">フォルダ名<input id="fn-name" placeholder="例：04_写真"></label></div><div class="act"><button class="btn" data-a="close">閉じる</button><button class="btn pri" data-a="fMkGo" data-id="'+el.dataset.id+'">作成</button></div>'); },
  fMkGo(el){ const c=caseById(el.dataset.id),n=$('#fn-name').value.trim(); if(!n){toast('フォルダ名を入力してください');return} c.files.push({id:uid(),type:'folder',name:n,parent:fdirOf(c),by:me().name,added:todayS(),updated:todayS()}); closeModal(); toast('フォルダ「'+n+'」を作成しました'); render(); },
  fRen(el){ const c=curCase(),f=c.files.find(x=>x.id===el.dataset.id); openModal('<h2>名前を変更</h2><div class="f"><label class="full">名前<input id="fn-name" value="'+esc(f.name)+'"></label></div><div class="act"><button class="btn" data-a="close">閉じる</button><button class="btn pri" data-a="fRenGo" data-id="'+f.id+'">変更</button></div>'); },
  fRenGo(el){ const c=curCase(),f=c.files.find(x=>x.id===el.dataset.id),n=$('#fn-name').value.trim(); if(!n){toast('名前を入力してください');return} f.name=n; f.updated=todayS(); closeModal(); render(); },
  fMove(el){ const c=curCase(),f=c.files.find(x=>x.id===el.dataset.id),ex=f.type==='folder'?fdesc(c,f.id):new Set();
    const opts=[{id:'',label:'資料（最上位）'}].concat(c.files.filter(x=>x.type==='folder'&&!ex.has(x.id)).map(x=>({id:x.id,label:fpath(c,x.id).map(y=>y.name).join(' / ')})));
    openModal('<h2>「'+esc(f.name)+'」を移動</h2><div class="f"><label class="full">移動先<select id="fm-to">'+opts.map(o=>'<option value="'+o.id+'"'+((f.parent||'')===o.id?' selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select></label></div><div class="act"><button class="btn" data-a="close">閉じる</button><button class="btn pri" data-a="fMoveGo" data-id="'+f.id+'">移動</button></div>'); },
  fMoveGo(el){ const c=curCase(),f=c.files.find(x=>x.id===el.dataset.id); f.parent=$('#fm-to').value||null; f.updated=todayS(); closeModal(); toast('移動しました'); render(); },
  fDel(el){ const c=curCase(),f=c.files.find(x=>x.id===el.dataset.id),s=f.type==='folder'?fdesc(c,f.id):new Set([f.id]); const n=s.size-1;
    confirmBox('「'+f.name+'」'+(n>0?'と、中の '+n+' 件':'')+'を削除します。','削除する',()=>{ c.files=c.files.filter(x=>!s.has(x.id)); render(); }); },
  fPrev(el){ const f=curCase().files.find(x=>x.id===el.dataset.id); if(f.url&&isImg(f))openModal('<h2>'+esc(f.name)+'</h2><img src="'+f.url+'" alt="" style="max-width:100%;max-height:70vh;display:block;margin:auto"><div class="act"><button class="btn" data-a="close">閉じる</button></div>',true); else toast('このプレビューでは、画像以外は開けません（本実装で対応）'); },
  imgView(el){ openModal('<h2>'+esc(el.dataset.name||'')+'</h2><img src="'+el.dataset.src+'" alt="" style="max-width:100%;max-height:70vh;display:block;margin:auto"><div class="act"><button class="btn" data-a="close">閉じる</button></div>',true); },
});
CH5.fq=el=>{ST.fq=el.value;rerender()};

const mentionsIn=t=>USERS.filter(u=>t.includes('@'+u.name)).map(u=>u.id);
function chatFiles(fs){ return (fs||[]).map(f=>isImg(f)&&f.url?'<a data-a="imgView" data-src="'+f.url+'" data-name="'+esc(f.name)+'" style="cursor:zoom-in;display:block;margin-top:4px"><img class="cimg" src="'+f.url+'" alt="'+esc(f.name)+'"></a><div class="small faint">'+esc(f.name)+'</div>':'<div class="chip" style="margin-top:4px">'+fileIcon(f)+' '+esc(f.name)+'　'+kb(f.size||0)+'</div>').join(''); }
function tabChat(c){

   (pend.length?'<div class="row" style="margin-bottom:6px">'+pend.map((f,i)=>'<span class="chip info">'+fileIcon(f)+' '+esc(f.name)+' <a data-a="chatUnpend" data-v="'+i+'" style="cursor:pointer" title="添付を外す">×</a></span>').join('')+'</div>':'')+

/* ---------- 行のドラッグ＆ドロップ（割り込み・階層へ入れる） ---------- */
function moveRows(c,ids,targetId,pos){
  const rows=levelRows(c), set=new Set(ids); if(set.has(targetId))return; const moved=rows.filter(r=>set.has(r.id)); if(!moved.length)return; snap(c);
  const keep=rows.filter(r=>!set.has(r.id));
  if(pos==='into'){ const g=keep.find(x=>x.id===targetId&&x.type==='group'); if(!g)return; g.children.splice(defaultIdx(g.children,'item'),0,...moved); }
  else { const i=keep.findIndex(x=>x.id===targetId); keep.splice(pos==='before'?i:i+1,0,...moved); }
  rows.splice(0,rows.length,...keep); ST.sel={}; render();
}
function moveToLevel(c,ids,levelIdx){ const e=curEst(c), rows=levelRows(c), set=new Set(ids); const moved=rows.filter(r=>set.has(r.id)); if(!moved.length)return;
  const dest=E.rowsAt(e,ST.estPath.slice(0,levelIdx+1)); if(dest===rows)return; snap(c); const keep=rows.filter(r=>!set.has(r.id)); rows.splice(0,rows.length,...keep); dest.splice(defaultIdx(dest,'item'),0,...moved); ST.sel={}; render(); }
function dragZone(tr,ev){ const rid=tr.dataset.rid, pair=[...tr.parentNode.querySelectorAll('tr[data-rid="'+rid+'"]')]; const top=pair[0].getBoundingClientRect().top, bot=pair[pair.length-1].getBoundingClientRect().bottom; const y=(ev.clientY-top)/Math.max(1,bot-top); const isG=pair[0].dataset.grp==='1';
  return {rid,pair,pos:isG&&y>.3&&y<.7?'into':(y<.5?'before':'after')}; }
function clearDrop(){ document.querySelectorAll('.est tr.drop-before,.est tr.drop-after,.est tr.drop-into').forEach(r=>r.classList.remove('drop-before','drop-after','drop-into')); document.querySelectorAll('.crumbs .drop-into').forEach(r=>r.classList.remove('drop-into')); }
document.addEventListener('dragstart',e=>{ const h=e.target.closest&&e.target.closest('.dh'); if(!h)return; const rid=h.dataset.drag; const ids=ST.sel[rid]?Object.keys(ST.sel):[rid]; ST.drag=ids; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',rid)}catch(x){} const tr=h.closest('tr'); try{e.dataTransfer.setDragImage(tr,12,12)}catch(x){} ids.forEach(id=>document.querySelectorAll('.est tr[data-rid="'+id+'"]').forEach(r=>r.classList.add('dragging'))); });
document.addEventListener('dragend',()=>{ ST.drag=null; clearDrop(); document.querySelectorAll('.est tr.dragging').forEach(r=>r.classList.remove('dragging')); });
document.addEventListener('dragover',e=>{ if(!ST.drag)return; const cr=e.target.closest&&e.target.closest('.crumbs button'); if(cr){e.preventDefault();clearDrop();cr.classList.add('drop-into');return}
  const tr=e.target.closest&&e.target.closest('.est tr[data-rid]'); if(!tr)return; const z=dragZone(tr,e); if(ST.drag.includes(z.rid))return; e.preventDefault(); clearDrop(); if(z.pos==='into')z.pair.forEach(r=>r.classList.add('drop-into')); else if(z.pos==='before')z.pair[0].classList.add('drop-before'); else z.pair[z.pair.length-1].classList.add('drop-after'); });
document.addEventListener('drop',e=>{ if(!ST.drag)return; const c=curCase(); const cr=e.target.closest&&e.target.closest('.crumbs button'); if(cr&&cr.dataset.v!==undefined){ e.preventDefault(); const ids=ST.drag; ST.drag=null; clearDrop(); moveToLevel(c,ids,Number(cr.dataset.v)); return }
  const tr=e.target.closest&&e.target.closest('.est tr[data-rid]'); if(!tr)return; e.preventDefault(); const z=dragZone(tr,e); const ids=ST.drag; ST.drag=null; clearDrop(); moveRows(c,ids,z.rid,z.pos); });

  L8.setSnap=settingsJson();
}
function warnOnce(msg){ if(L8.warned.has(msg))return; L8.warned.add(msg); toast(msg); }

function computeDiff(){
  const d={any:false,ins:{},upd:{},del:{}};
  Object.keys(T8).forEach(t=>{
    const cur=rowsOf(t), old=L8.snap[t]||new Map(), S=T8[t], ins=[], upd=[], del=[];
    cur.forEach((v,k)=>{
      const o=old.get(k), why=S.bad&&v.obj?S.bad(v.obj):'';
      if(why){warnOnce(why);return;}
      if(!o){ins.push({k,row:v.row,obj:v.obj});return;}
      const ch={};Object.keys(v.row).forEach(c=>{if(JSON.stringify(v.row[c])!==JSON.stringify(o[c]))ch[c]=v.row[c];});
      if(Object.keys(ch).length)upd.push({k,ch,row:v.row,obj:v.obj});
    });
    old.forEach((_,k)=>{if(!cur.has(k))del.push(k);});
    if(ins.length||upd.length||del.length){d.any=true;d.ins[t]=ins;d.upd[t]=upd;d.del[t]=del;}
  });
  const sj=settingsJson();
  d.settings=(sj!==L8.setSnap)?sj:null;
  if(d.settings!==null)d.any=true;
  return d;
}

async function fetchAll(t,order){
  const out=[];
  for(let from=0;;from+=1000){
    let q=L8.sb.from(t).select('*');
    order.forEach(o=>{q=q.order(o);});
    const {data,error}=await q.range(from,from+999);
    if(error)throw error;
    out.push(...(data||[]));
    if((data||[]).length<1000)break;
  }
  return out;
}

      cust:{name:cu.name||'',zip:cu.zip||'',addr:cu.addr||'',tel:cu.tel||'',contact:cu.contact||''},
      assignees:(mem.get(r.id)||[]).filter(pid=>USERS.some(u=>u.id===pid)),
      files:defFiles(),chat:[],ests:[mkEst('見積'+circ(1),'検討中',[])],costs:[]};
    c.estId=c.ests[0].id; CASES.push(c);
  });
  TABS.length=0;
  res.work_tabs.forEach(r=>TABS.push({id:r.id,staff:r.profile_id,date:r.work_date,start:r.start_time,end:r.end_time,caseId:r.case_id||'',title:r.title||'',ot:!!r.overtime,locked:!!r.locked}));
  snapshot();
  L8.loaded=true;
}

/* ---------- 自動保存（画面とサーバーの差分だけを送る） ---------- */
function setSync(s){
  const e=document.getElementById('syncTxt'); if(!e)return;
  e.dataset.s=s; e.textContent=({ok:'同期済み',saving:'保存中…',error:'要確認',loading:'読込中…'})[s]||'';
}
function scheduleFlush(ms){clearTimeout(L8.timer);L8.timer=setTimeout(flush,ms==null?400:ms);}
async function flush(){
  if(!L8.sb||!L8.user||!L8.loaded)return;
  if(L8.flushing){L8.again=true;return;}
  L8.flushing=true;
  try{
    do{
      L8.again=false;
      const d=computeDiff();
      if(!d.any)break;
      setSync('saving');
      for(const t of UP_ORDER){
        const S=T8[t], ins=d.ins[t]||[], upd=d.upd[t]||[];
        if(ins.length){
          const rows=ins.map(x=>t==='cases'?Object.assign({created_by:L8.user.id},x.row):x.row);
          const {error}=await L8.sb.from(t).insert(rows);
          if(error){
            if(t==='cases'&&error.code==='23505'&&L8.retry<3){   // 案件番号が、ほかの人と同時になった
              L8.retry++; await renumberCases(ins); L8.again=true; break;
            }
            throw error;
          }
          ins.forEach(x=>{L8.snap[t].set(x.k,clone(x.row));if(x.obj&&S.keyed)x.obj._k=x.k;});
        }
        for(const x of upd){
          const col=Array.isArray(S.pk)?null:S.pk;
          const {error}=await L8.sb.from(t).update(x.ch).eq(col,x.k);
          if(error)throw error;
          L8.snap[t].set(x.k===x.row[col]?x.k:x.row[col],clone(x.row));
          if(x.k!==x.row[col]){L8.snap[t].delete(x.k);if(x.obj&&S.keyed)x.obj._k=x.row[col];}
        }
      }
      for(const t of DEL_ORDER){
        const S=T8[t], del=d.del[t]||[];
        for(const k of del){
          let q=L8.sb.from(t).delete();
          if(Array.isArray(S.pk)){const p=k.split('|');q=q.eq(S.pk[0],p[0]).eq(S.pk[1],p[1]);}else q=q.eq(S.pk,k);
          const {error}=await q;
          if(error)throw error;
          L8.snap[t].delete(k);
        }
      }
      if(d.settings!==null&&rk()>=4){
        const {error}=await L8.sb.from('app_settings').upsert({key:'main',value:JSON.parse(d.settings),min_read_role:'editor'},{onConflict:'key'});
        if(error)throw error;
        L8.setSnap=d.settings;
      }else if(d.settings!==null){L8.setSnap=d.settings;}
    }while(L8.again);
    L8.retry=0;
    setSync('ok');
  }catch(e){
    console.error(e);
    setSync('error');
    toast('保存できませんでした：'+((e&&e.message)||'不明なエラー')+'　サーバーの内容に戻します。');
    try{await loadAll();rerender();setSync('ok');}catch(e2){console.error(e2);}
  }finally{L8.flushing=false;}
}
async function renumberCases(ins){
  const {data}=await L8.sb.from('cases').select('case_no').order('case_no');
  const nums=(data||[]).map(r=>r.case_no).concat(CASES.filter(c=>!ins.some(x=>x.obj===c)).map(c=>c.no)).filter(x=>String(x).startsWith('0059')).map(Number);
  let n=nums.length?Math.max(...nums):59000000;
  ins.forEach(x=>{if(x.obj){n++;x.obj.no=String(n).padStart(10,'0');}});
  rerender();
}

/* ---------- 他の人の変更の取り込み（一定間隔。入力中・ダイアログ表示中は待つ） ---------- */
async function refresh(force){
  if(!L8.sb||!L8.user||!L8.loaded||L8.flushing)return;
  const ae=document.activeElement, typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!document.getElementById('lg').contains(ae);
  if(!force&&(typing||document.getElementById('ov')))return;
  if(computeDiff().any)return;
  try{setSync('loading');await loadAll();setSync('ok');
    if(!USERS.some(u=>u.id===L8.user.id)){forceLogout('このアカウントは、使えなくなりました。');return;}
    rerender();
  }catch(e){console.error(e);setSync('error');}
}

/* ---------- 画面の組み込み（描画の最後に、上部バーと保存の予約を足す） ---------- */
const _render=render;
render=function(){
  _render();
  const w=document.querySelector('#top .who');
  if(w){const u=USERS.find(x=>x.id===ST.uid);
    w.outerHTML='<span class="who"><span id="syncTxt" class="sync" data-s="ok" title="クリックで最新の内容を読み込みます" data-a="resync">同期済み</span><b>'+esc(u?u.name:'')+'</b><span class="chip">'+esc(u?ROLE_JA[u.role]:'')+'</span><button class="btn sm" data-a="doLogout">ログアウト</button></span>';}
  scheduleFlush();
};

/* ---------- ログイン／ログアウト ---------- */
function lgMsg(t){const e=document.getElementById('lgErr');e.textContent=t||'';e.style.display=t?'block':'none';}
async function startSession(user){
  setSync('loading');
  await loadAll();
  const me=USERS.find(u=>u.id===user.id);
  if(!me){
    try{await L8.sb.auth.signOut();}catch(e){}
    lgMsg('このアカウントは使えません。最高権限者に確認してください。');return false;
  }
  L8.user={id:me.id};
  ST.uid=me.id; ST.tab='cal'; ST.caseId=null;
  document.getElementById('lg').style.display='none';
  document.getElementById('appRoot').style.display='';
  lgMsg('');
  render(); setSync('ok');
  if(me.role==='master')ensureStaff();
  clearInterval(L8.refreshT); L8.refreshT=setInterval(()=>{scheduleFlush(0);},3000);
  L8.pollT=setInterval(()=>refresh(false),25000);
  return true;
}
function clearData(){
  USERS.length=0;DEPTS.length=0;CASES.length=0;TABS.length=0;L8.snap={};L8.loaded=false;L8.user=null;
}
async function doLogin(){
  if(!L8.sb){lgMsg('接続の設定が未入力か、Supabase の読み込みに失敗しました。');return;}
  const lid=normDigits(document.getElementById('lgId').value), pass=document.getElementById('lgPw').value;
  const btn=document.getElementById('lgBtn');
  if(!/^\d{4,20}$/.test(lid)||!pass){lgMsg('ログインIDまたはパスワードが違います');return;}
  btn.disabled=true;lgMsg('');
  try{
    const {data,error}=await L8.sb.auth.signInWithPassword({email:lid+'@'+ID_DOMAIN,password:pass});
    if(error||!data||!data.user){
      lgMsg(error&&/invalid login/i.test(error.message||'')?'ログインIDまたはパスワードが違います':'ログインできませんでした：'+((error&&error.message)||'不明なエラー'));return;
    }
    await startSession(data.user);
  }catch(e){console.error(e);lgMsg('通信できませんでした。電波とネットワークを確認してください。');}
  finally{btn.disabled=false;}
}
async function doLogout(){
  clearTimeout(L8.timer);
  try{await flush();}catch(e){}
  L8.user=null;   // ログアウト時の通知を「期限切れ」と取り違えないため
  try{if(L8.sb)await L8.sb.auth.signOut();}catch(e){}
  forceLogout('');
}
function forceLogout(msg){
  clearInterval(L8.refreshT);clearInterval(L8.pollT);clearData();
  closeModal();
  document.getElementById('appRoot').style.display='none';
  document.getElementById('lg').style.display='flex';
  document.getElementById('lgPw').value='';
  lgMsg(msg||'');
  if(msg&&L8.sb)L8.sb.auth.signOut().catch(()=>{});
}

/* ---------- アカウント管理（Edge Function 'manage-accounts'。最高権限者だけ） ---------- */
async function accountApi(body){
  try{
    const {data,error}=await L8.sb.functions.invoke('manage-accounts',{body});
    if(error){
      let msg=error.message||'失敗しました';
      try{const j=await error.context.json();if(j&&j.error)msg=j.error;}catch(e){}
      alert(msg);return false;
    }
    if(data&&data.error){alert(data.error);return false;}
    return true;
  }catch(e){console.error(e);alert('通信できませんでした。');return false;}
}
/* アカウントには、同じ名前のスタッフ（営業・工事担当などに使う担当者）を1つ紐づける */
async function ensureStaff(){
  const miss=USERS.filter(u=>!u.staffId);
  if(!miss.length)return;
  let changed=false;
  for(const u of miss){
    const sid=uid();
    const {error}=await L8.sb.from('staff').insert({id:sid,name:u.name});
    if(error){console.error(error);continue;}
    const ok=await accountApi({action:'update',id:u.id,name:u.name,loginId:u.loginId,role:u.role,staffId:sid});
    if(!ok){await L8.sb.from('staff').delete().eq('id',sid);continue;}
    changed=true;
  }
  if(changed){await loadAll();rerender();}
}
const gv=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const rolesFor=()=>rk()>=5?['viewer','editor','leader','admin']:['viewer','editor','leader'];
function roleOpts(sel){return rolesFor().concat(sel&&!rolesFor().includes(sel)?[sel]:[]).map(r=>'<option value="'+r+'"'+(r===sel?' selected':'')+'>'+ROLE_JA[r]+'</option>').join('');}
function deptOpts(sel){return '<option value="">（未設定）</option>'+DEPTS.map(d=>'<option value="'+esc(d.code)+'"'+(d.code===sel?' selected':'')+'>'+esc(d.code)+' '+esc(d.name)+'</option>').join('');}

  openModal('<h2>アカウントを追加</h2><div class="f"><label>ログインID（半角数字 4〜20桁）<input id="ua-id" inputmode="numeric" autocomplete="off"></label><label>氏名<input id="ua-name" autocomplete="off"></label><label>パスワード（半角英数字 8〜32文字）<input id="ua-pass" type="text" autocomplete="off"></label><label>部門<select id="ua-dept">'+deptOpts('')+'</select></label><label>権限<select id="ua-role">'+roleOpts('viewer')+'</select></label></div><p class="small muted">同じ名前のスタッフ（営業・工事担当の選択に使う担当者）も、自動で作られます。パスワードは、本人にだけ伝えてください。</p><div class="act"><button class="btn" data-a="close">閉じる</button><button class="btn pri" id="ua-btn" data-a="uAdd">追加</button></div>');
};
ACT.uAdd=async()=>{
  const id=normDigits(gv('ua-id')), name=gv('ua-name'), pass=document.getElementById('ua-pass').value, role=gv('ua-role'), dept=gv('ua-dept');
  if(!/^\d{4,20}$/.test(id)){toast('ログインIDは、半角数字4〜20桁にしてください');return;}
  if(!name){toast('氏名を入力してください');return;}
  if(!/^[A-Za-z0-9]{8,32}$/.test(pass)){toast('パスワードは、半角英数字8〜32文字にしてください');return;}
  if(USERS.some(u=>u.loginId===id)){toast('そのログインIDは、すでに使われています');return;}
  const btn=document.getElementById('ua-btn'); btn.disabled=true;
  try{
    const sid=uid();
    const r1=await L8.sb.from('staff').insert({id:sid,name});
    if(r1.error){alert('スタッフを作れませんでした：'+r1.error.message);return;}
    const ok=await accountApi({action:'create',name,loginId:id,password:pass,role,staffId:sid});
    if(!ok){await L8.sb.from('staff').delete().eq('id',sid);return;}
    if(dept){
      const p=await L8.sb.from('profiles').select('id').eq('login_id',id).single();
      if(p.data){const r3=await L8.sb.from('profiles').update({dept_code:dept}).eq('id',p.data.id);if(r3.error)alert('部門を設定できませんでした：'+r3.error.message);}
    }
    closeModal(); await loadAll(); rerender(); toast('アカウントを追加しました');
  }finally{btn.disabled=false;}
};
ACT.acctEdit=el=>{
  if(rk()<5)return; const u=USERS.find(x=>x.id===el.dataset.id); if(!u)return;
  openModal('<h2>アカウントを編集</h2><div class="f"><label>ログインID<input id="ue-id" inputmode="numeric" value="'+esc(u.loginId)+'"></label><label>氏名<input id="ue-name" value="'+esc(u.name)+'"></label><label>新しいパスワード（変えない時は空のまま）<input id="ue-pass" type="text" autocomplete="off"></label><label>権限<select id="ue-role">'+roleOpts(u.role)+'</select></label></div><div class="act"><button class="btn" data-a="close">閉じる</button><button class="btn pri" id="ue-btn" data-a="acctSave" data-id="'+u.id+'">保存</button></div>');
};
ACT.acctSave=async el=>{
  const u=USERS.find(x=>x.id===el.dataset.id); if(!u)return;
  const id=normDigits(gv('ue-id')), name=gv('ue-name'), pass=document.getElementById('ue-pass').value, role=gv('ue-role');
  if(!/^\d{4,20}$/.test(id)){toast('ログインIDは、半角数字4〜20桁にしてください');return;}
  if(!name){toast('氏名を入力してください');return;}
  if(pass&&!/^[A-Za-z0-9]{8,32}$/.test(pass)){toast('パスワードは、半角英数字8〜32文字にしてください');return;}
  const btn=document.getElementById('ue-btn'); btn.disabled=true;
  try{
    const ok=await accountApi({action:'update',id:u.id,name,loginId:id,password:pass||undefined,role,staffId:u.staffId||null});

};
ACT.acctDel=el=>{
  if(rk()<5)return; const u=USERS.find(x=>x.id===el.dataset.id); if(!u)return;

ACT.doLogout=doLogout;
ACT.resync=()=>refresh(true);
CH.urole=async el=>{
  const u=USERS.find(x=>x.id===el.dataset.id); if(!u)return; const role=el.value;

ACT.acct=()=>{const u=USERS.find(x=>x.id===ST.uid);if(!u)return;
  openModal('<h2>アカウントメニュー</h2><dl class="kv"><dt>氏名</dt><dd>'+esc(u.name)+'</dd><dt>ログインID</dt><dd class="num">'+esc(u.loginId)+'</dd><dt>部門</dt><dd>'+esc(deptName(u.dept))+'</dd><dt>権限</dt><dd>'+ROLE_JA[u.role]+'</dd></dl><div class="act"><button class="btn" data-a="close">閉じる</button><button class="btn pri" data-a="doLogout">ログアウト</button></div>');};

/* ---------- 起動 ---------- */
(function init(){
  document.getElementById('lgForm').addEventListener('submit',e=>{e.preventDefault();doLogin();});
  window.addEventListener('beforeunload',e=>{if(L8.user&&L8.loaded&&computeDiff().any){e.preventDefault();e.returnValue='';}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(false);});
  if(!SUPABASE_URL||!SUPABASE_KEY||!(window.supabase&&window.supabase.createClient)){
    lgMsg(!SUPABASE_URL||!SUPABASE_KEY?'接続の設定（SUPABASE_URL と SUPABASE_KEY）が未入力です。':'Supabase の読み込みに失敗しました。ネットワークを確認して、再読み込みしてください。');
    return;
  }
  L8.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  L8.sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&L8.user)forceLogout('ログインの有効期限が切れました。もう一度ログインしてください。');});
  (async()=>{
    try{
      const {data}=await L8.sb.auth.getSession();
      if(data&&data.session){lgMsg('読み込み中…');await startSession(data.session.user);}
    }catch(e){console.error(e);lgMsg('');}
  })();
})();
